<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RiskReflex | Understand Risk Before Impact</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orb.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background Glow -->
    <div class="background-glow"></div>

    <!-- Header -->
    <header>

        <div class="logo-section">
            <img src="images/logo.png" alt="RiskReflex" class="logo">
        </div>

        <button class="rix-btn">
            ENTER RIX
        </button>

    </header>

    <!-- Main Hero -->
    <main>

        <section class="hero">

            <div class="center-content">

                <!-- Premium Orb -->
                <div class="orb-container">

                    <div class="ring ring1"></div>
                    <div class="ring ring2"></div>
                    <div class="ring ring3"></div>

                    <div class="orb-core">

                        <!-- Optional R Logo inside orb -->
                        <img
                            src="images/rr-icon.png"
                            alt="RiskReflex"
                            class="orb-logo">

                    </div>

                </div>

                <!-- Branding -->

                <h1>RISKREFLEX</h1>

                <h2>
                    UNDERSTAND RISK BEFORE IMPACT
                </h2>

                <p class="tagline">
                    AI GOVERNANCE • CYBER RISK INTELLIGENCE • FUTURE READY
                </p>

            </div>

        </section>

    </main>

    <!-- Navigation Nodes -->

    <nav class="node-menu">

        <a href="#">Platform</a>

        <a href="#">Solutions</a>

        <a href="#">Research</a>

        <a href="#">RIX AI</a>

        <a href="#">About</a>

        <a href="#">Contact</a>

    </nav>

    <!-- Orb Animation Engine -->
    <script src="js/orb.js"></script>

</body>

</html>
